# Two-node testnet harness for converging on the new post-DAA-fix fork.
#
# Fork point: HEIGHT 2,240,000 (baked into consensus as
# nTestnetDaaFixActivationHeight in src/kernel/chainparams.cpp). At and
# above this height the new capped/throttled min-difficulty rule is
# enforced; the spam fork's uncapped powLimit drops above 2,240,000 are
# rejected during header presync.
#
# Both nodes:
#   * pull the patched doged image from GHCR (built by .github/workflows/
#     docker.yml from the fix/testnet-daa-spam branch). The DAA-fix
#     activation height (2,240,000) is baked into that image.
#   * use public testnet DNS + fixed seeds for IBD. The new
#     PermittedDifficultyTransition rule automatically rejects any peer
#     serving the spam fork past the activation height, so letting public
#     testnet in is SAFE and gives us a free initial sync up to the cut.
#   * additionally peer with each other via -addnode= over the private
#     docker bridge "dogenet", and with three known-live public testnet
#     peers (testseed.jrn.me.uk + 2 hardcoded seeds), so once the local
#     miner extends the honest chain past 2,240,000 both nodes converge
#     on the new fork without having to wait for public propagation.
#   * may optionally load a -recoverycheckpoint=H:HASH pin for additional
#     belt-and-braces protection (uncomment + set once HEIGHT:HASH is
#     known) — the consensus rule already invalidates the spam fork, the
#     pin makes it also unreachable via reorg.
#
# doged-a additionally exposes the stratum port (23333) for an external
# GPU miner — see testnet/start-miner.sh.
#
# Usage:
#   docker compose -f testnet/docker-compose.fork.yml pull
#   docker compose -f testnet/docker-compose.fork.yml up -d
#   docker compose -f testnet/docker-compose.fork.yml logs -f doged-a doged-b
#   ./testnet/validate-fork.sh
#
# Stop / wipe:
#   docker compose -f testnet/docker-compose.fork.yml down -v

services:
  doged-a:
    image: ghcr.io/frenchbtc/doged:fix-testnet-daa-spam
    container_name: doged-fork-a
    restart: unless-stopped
    networks:
      dogenet:
        aliases: [doged-a]
    command:
      - -testnet
      - -server=1
      - -listen=1
      - -bind=0.0.0.0
      - -port=44556
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcport=44555
      - -rpcuser=dogetest
      - -rpcpassword=dogepass
      # Persistent peers: doged-b (intra-cluster convergence) plus three
      # known-live public testnet peers so IBD is fast even when the
      # default DNS seed is slow to resolve.
      - -addnode=doged-b:44556
      - -addnode=testseed.jrn.me.uk:44556
      - -addnode=185.232.70.226:44556
      - -addnode=37.27.63.117:44556
      # Recovery checkpoint pin (UNCOMMENT once HEIGHT:HASH is known —
      # MUST be identical on both nodes).
      # - -recoverycheckpoint=<height>:<hash>
      # Stratum / miner side (only doged-a serves miners externally).
      - -stratum
      - -stratumport=23333
      - -stratumbind=0.0.0.0
      - -coinbasetag=/doged-fork/
      - -txindex=1
      - -printtoconsole=1
      - -debug=mergemine
    ports:
      - "44555:44555"   # doged-a RPC (debug)
      - "44556:44556"   # doged-a P2P (optional external)
      - "23333:23333"   # Stratum (laptop GPU miner)
    volumes:
      - doged-a-data:/home/dogeuser/.doged
    mem_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  doged-b:
    image: ghcr.io/frenchbtc/doged:fix-testnet-daa-spam
    container_name: doged-fork-b
    restart: unless-stopped
    networks:
      dogenet:
        aliases: [doged-b]
    command:
      - -testnet
      - -server=1
      - -listen=1
      - -bind=0.0.0.0
      - -port=44556
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcport=44555
      - -rpcuser=dogetest
      - -rpcpassword=dogepass
      # Persistent peers: doged-a (intra-cluster convergence) plus the
      # same three public testnet peers as doged-a. NB: do NOT add
      # doged-b here — that would be self-addressing.
      - -addnode=doged-a:44556
      - -addnode=testseed.jrn.me.uk:44556
      - -addnode=185.232.70.226:44556
      - -addnode=37.27.63.117:44556
      # Same pin as doged-a.
      # - -recoverycheckpoint=<height>:<hash>
      - -txindex=1
      - -printtoconsole=1
    ports:
      # Different host ports so both RPCs are reachable for debugging /
      # validate-fork.sh; intra-cluster comms still go over container
      # ports (44556) on the dogenet bridge.
      - "44557:44555"   # doged-b RPC (debug)
    volumes:
      - doged-b-data:/home/dogeuser/.doged
    mem_limit: 8g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  dogenet:
    driver: bridge

volumes:
  doged-a-data:
  doged-b-data:
